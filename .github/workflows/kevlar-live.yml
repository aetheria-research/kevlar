name: KEVlar Live

# Rigenera la pagina pubblica dal catalogo CISA KEV e la pubblica su GitHub Pages.
# Dato pubblico (nessun segreto). Trigger: push su main (codice gia' fidato, che
# e' passato da una PR), schedulato e manuale. MAI l'evento sulle pull request non
# fidate, che girerebbe con permessi elevati sul codice di una PR esterna.
on:
  push:
    branches: [main]
    paths:                 # ri-pubblica solo se cambia il generatore o il workflow
      - "kevlar.py"
      - ".github/workflows/kevlar-live.yml"
  schedule:
    - cron: "0 6 * * 1"    # ogni lunedi' alle 06:00 UTC (dato CISA fresco)
  workflow_dispatch: {}    # lancio a mano dalla tab Actions

# Permessi minimi: leggere il repo + pubblicare su Pages via OIDC + firmare
# l'attestazione di provenienza dei file pubblicati. Niente altro.
permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write

# Una pubblicazione alla volta; non interrompere un deploy gia' in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # NB sicurezza: solo action ufficiali GitHub, pinnate al major. Versioni su
      # Node 24. Dependabot (.github/dependabot.yml) le tiene aggiornate da solo
      # e puo' pinnarle all'hash di commit per l'indurimento massimo.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Genera la pagina (scarica il CISA KEV pubblico)
        run: python kevlar.py --out public --html public/index.html

      # Provenienza verificabile: GitHub firma (Sigstore, formato SLSA) l'hash di
      # ogni file pubblicato legandolo a questo workflow e a questo commit.
      # Chiunque verifica con: gh attestation verify <file> --repo aetheria-research/kevlar
      - name: Attestazione di provenienza dei file pubblicati
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "public/*"

      - name: Upload artifact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy su GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
